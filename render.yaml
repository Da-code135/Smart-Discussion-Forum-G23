services:
  - type: web
    name: smart-discussion-forum
    env: docker
    plan: free
    healthCheckPath: /up
    autoDeploy: true
    branch: main
    buildFilter:
      ignoredPaths:
        - docs/**
        - "**/*.md"
        - .github/**
        - .idea/**
        - tests/**
    envVars:
      - key: APP_NAME
        value: Smart Discussion Forum
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://smart-discussion-forum.onrender.com
      - key: APP_KEY
        sync: false

      # Database — set to the Supabase Postgres connection string in the
      # dashboard (Render's own free database expires after 30 days).
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false

      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

      # Seed the database once by flipping this to true, then set it back.
      - key: RUN_SEED
        value: false

      # Broadcasting via Pusher (Reverb cannot run on the free tier).
      # VITE_* values are baked into the JS bundle at build time — trigger
      # a rebuild after changing them.
      - key: BROADCAST_CONNECTION
        value: pusher
      - key: PUSHER_APP_ID
        sync: false
      - key: PUSHER_APP_KEY
        sync: false
      - key: PUSHER_APP_SECRET
        sync: false
      - key: PUSHER_APP_CLUSTER
        sync: false
      - key: VITE_BROADCASTER
        value: pusher
      - key: VITE_PUSHER_APP_KEY
        sync: false
      - key: VITE_PUSHER_APP_CLUSTER
        sync: false

      # Outgoing mail (verification, OTP, welcome) — free SMTP provider
      # credentials, e.g. Brevo or Resend.
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Smart Discussion Forum

      # Shared secret for POST /api/internal/run-schedule (Supabase Cron).
      - key: CRON_SECRET
        sync: false

# Render's free Postgres (expires ~30 days after creation). Kept for
# reference until the Supabase migration is complete — DATABASE_URL above
# no longer points at it.
databases:
  - name: studdit-db
    databaseName: studdit
    user: studdit
    plan: free
